<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Drawify · Şifonyer daveti</title>
<meta name="description" content="Drawify’da şifonyere katılmak için davet. · An invite to join a dresser in Drawify.">
<meta property="og:site_name" content="Drawify">
<meta property="og:type" content="website">
<meta property="og:title" content="Drawify · Şifonyer daveti">
<meta property="og:description" content="Seni bir şifonyere davet ettiler. Kodu kopyala ya da Drawify’da aç. · You’re invited to join a dresser.">
<meta property="og:image" content="https://drawify.cozus.net/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  .join { text-align: center; padding-top: 24px; }
  .join h1 { margin-bottom: 6px; }
  .join p { color: var(--sub); margin: 0 auto 22px; max-width: 420px; }
  .code {
    display: inline-block; font: 900 38px/1.2 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 26px; margin-bottom: 18px;
    user-select: all; -webkit-user-select: all;
  }
  .btns { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 0 auto; }
  .btn {
    display: block; min-height: 56px; line-height: 56px; border-radius: 18px; font-weight: 800; font-size: 17px;
    text-decoration: none; border: 0; cursor: pointer; font-family: inherit; width: 100%;
  }
  .primary { background: var(--accent); color: #231F1D; }
  .secondary { background: var(--accent-soft); color: var(--text); }
  .ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  .hint { font-size: 14px; margin-top: 18px !important; }
</style>
</head>
<body>
<main>
<header><a class="brand" href="https://legal.cozus.net/">Drawify</a></header>
<section class="join">
  <h1 id="title">Join a dresser</h1>
  <p id="lead"></p>
  <div id="codeBox" class="code" aria-live="polite"></div>
  <div class="btns">
    <button id="copy" class="btn primary" type="button"></button>
    <a id="open" class="btn secondary" href="#"></a>
    <a id="get" class="btn ghost" rel="noreferrer noopener" href="https://play.google.com/store/apps/details?id=com.cozus.drawify"></a>
  </div>
  <p id="hint" class="hint"></p>
</section>
</main>
<script src="join.js"></script>
</body>
</html>
